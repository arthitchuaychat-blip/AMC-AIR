<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Top Mentor — ระบบติดตาม Mentoring & Happiness Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1830; --ink2:#1c2a52; --gold:#e8a614; --gold2:#f6c64b;
  --navy:#1e2a4a; --navy2:#2b3b66;
  --bg:#eef1f8; --card:#ffffff; --line:#e7ebf4; --txt:#1c2540; --mut:#8791ab;
  --ok:#12b76a; --bad:#ef4444; --warn:#f79009; --info:#3b6ef6;
  --sh:0 10px 30px rgba(28,42,82,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);font-size:14.5px;background:var(--bg);
  background-image:radial-gradient(700px 300px at 15% -5%,rgba(246,198,75,.16),transparent 60%),radial-gradient(800px 350px at 90% -10%,rgba(59,110,246,.10),transparent 60%);
  background-attachment:fixed}
header{background:linear-gradient(120deg,#111a35 0%,#1d2c58 55%,#25356b 100%);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 6px 24px rgba(10,16,40,.35)}
header .logo{display:flex;align-items:center;gap:11px}
header .logo .badge{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(232,166,20,.45)}
header h1{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:.2px}
header h1 small{display:block;font-size:10.5px;font-weight:300;opacity:.65;letter-spacing:.4px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:rgba(255,255,255,.07);padding:4px;border-radius:99px}
nav button{border:0;background:transparent;color:#cdd6ee;padding:8px 16px;border-radius:99px;cursor:pointer;font-family:inherit;font-size:13px;transition:.18s}
nav button:hover{color:#fff;background:rgba(255,255,255,.10)}
nav button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241c04;font-weight:600;box-shadow:0 3px 10px rgba(232,166,20,.4)}
#saved{font-size:11px;color:#c9d4ef;min-width:64px;text-align:right;transition:.3s}
main{max-width:1200px;margin:0 auto;padding:22px 18px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h2 .cnt{background:#f1f4fb;color:var(--mut);font-size:11.5px;padding:3px 11px;border-radius:99px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh)}
.stat .ic{width:46px;height:46px;border-radius:15px;font-size:21px;display:flex;align-items:center;justify-content:center;background:#f1f4fb;flex:none}
.stat .n{font-size:24px;font-weight:700;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.stat.gold .ic{background:#fdf1d2}.stat.green .ic{background:#dcf7e9}.stat.red .ic{background:#fee4e2}.stat.blue .ic{background:#e3ebfe}
.stat.gold .n{color:#b97e02} .stat.green .n{color:#0a9152} .stat.red .n{color:#d92d20} .stat.blue .n{color:#2f5ce0}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;color:#9aa3bd;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.7px}
td{padding:12px;border-bottom:1px solid #f2f4fa;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#f7f9ff}
.tblwrap{overflow-x:auto}
.mname{font-weight:600} .mname small{display:block;font-weight:300;font-size:11.5px;color:var(--mut)}
.wk{display:inline-flex;gap:3px}
.wk i{width:13px;height:13px;border-radius:4px;background:#e9edf6;display:inline-block;font-style:normal}
.wk i.t{background:var(--ok)} .wk i.f{background:var(--bad)}
.chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#f1f4fb;color:var(--mut);margin:1px;font-weight:500}
.chip.t{background:#dcf7e9;color:#0a9152} .chip.f{background:#fee4e2;color:#d92d20}
.badge{display:inline-block;font-size:11.5px;padding:4px 11px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-done{background:#dcf7e9;color:#0a9152} .b-wait{background:#e3ebfe;color:#2f5ce0}
.b-due{background:#fdeed3;color:#b25e04} .b-notyet{background:#f1f4fb;color:#8a94ad}
.b-first{background:#fdf1d2;color:#946b00} .b-old{background:#e9ebf7;color:#4a5480}
/* การ์ด Mentoring */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.mcard{border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;transition:.18s;background:linear-gradient(180deg,#fff,#fbfcff)}
.mcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,42,82,.12);border-color:#f0cf7e}
.mtop{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex:none;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14)}
.minfo{flex:1;min-width:0}
.minfo b{font-size:14.5px;display:block}
.minfo small{display:block;font-size:11px;color:var(--mut);font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip{font-size:10.5px;padding:4px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.mmeta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#5a6584;margin-bottom:11px}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg i{flex:1;height:9px;border-radius:6px;background:#e9edf6}
.seg i.t{background:linear-gradient(135deg,var(--gold2),var(--gold))}
.seg i.f{background:#f6b5b1}
.seg.done i.t{background:linear-gradient(135deg,#2fd58a,#0fa564)}
.mprog{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.mprog b{color:#3f4a6b;font-weight:600}
/* ปุ่ม + ฟอร์ม */
button.btn{border:0;background:linear-gradient(135deg,#25356b,#17224a);color:#fff;font-family:inherit;font-size:13px;padding:9px 17px;border-radius:12px;cursor:pointer;transition:.16s;box-shadow:0 3px 10px rgba(23,34,74,.22)}
button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(23,34,74,.3)}
button.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241c04;font-weight:600;box-shadow:0 3px 10px rgba(232,166,20,.35)}
button.btn.ghost{background:#eef1f9;color:var(--txt);box-shadow:none}
button.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
button.btn.red{background:#feecec;color:#d92d20;box-shadow:none}
input[type=text],input[type=date],input[type=url],select,textarea{font-family:inherit;font-size:13.5px;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);outline:none;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(246,198,75,.18)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=text]{max-width:280px}
.toolbar select{width:auto}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
/* modal */
#ovl{position:fixed;inset:0;background:rgba(12,18,40,.5);backdrop-filter:blur(3px);display:none;z-index:100;overflow-y:auto;padding:26px 14px}
#ovl.show{display:block}
.modal{background:#fff;border-radius:22px;max-width:720px;margin:0 auto;padding:24px;position:relative;box-shadow:0 24px 60px rgba(10,16,40,.3)}
.modal .x{position:absolute;top:16px;right:18px;border:0;background:#eef1f9;width:34px;height:34px;border-radius:99px;cursor:pointer;font-size:15px;transition:.15s}
.modal .x:hover{background:#e2e7f3}
.modal h3{font-size:17px;margin-bottom:4px;padding-right:44px;font-weight:700}
.modal .sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.sect{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.sect h4{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.wkrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #f2f4fa}
.wkrow .t{flex:1}
.wkrow .t b{font-size:13px} .wkrow .t small{display:block;color:var(--mut);font-size:11.5px}
.tri{border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:6px 13px;border-radius:99px;cursor:pointer;min-width:100px;transition:.15s}
.tri:hover{border-color:#c9d2e8}
.tri.t{background:#dcf7e9;border-color:#93e5bd;color:#0a9152;font-weight:600}
.tri.f{background:#fee4e2;border-color:#f6b5b1;color:#d92d20;font-weight:600}
.hsbox{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fcfdff}
.hsbox .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hsbox .top b{font-size:13px}
.cbl{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.cbl input{width:17px;height:17px;accent-color:var(--ok)}
.note-line{background:#fffaeb;border:1px solid #f7e6ad;border-radius:11px;padding:8px 12px;font-size:13px;margin-top:8px}
.help{background:#eef4ff;border:1px solid #d3e0fb;border-radius:16px;padding:15px;font-size:13px;line-height:1.7;color:#2b3f6b}
.empty{color:var(--mut);text-align:center;padding:26px;font-size:13px}
.expander{width:100%;margin-top:10px;text-align:center}
.stat.purple .ic{background:#efe7fe}.stat.purple .n{color:#7c3aed}
/* กล่องสไลด์ในหน้าสมาชิก */
.slbox{border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;background:#fcfdff}
.slbox.has{border-color:#93e5bd;background:#f6fdf9}
.slhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.slhead b{font-size:13px}
.slfile{display:flex;align-items:center;gap:6px;font-size:11.5px;background:#f1f4fb;border-radius:9px;padding:6px 9px}
.slfile a{color:#2f5ce0;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slfile a:hover{text-decoration:underline}
.slfile button{border:0;background:transparent;cursor:pointer;color:#98a1b8;font-size:13px}
.rephead{display:none}
@media print{
  body{background:#fff;font-size:12px}
  header,.no-print{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:4px;page-break-inside:avoid}
  .rephead{display:block;text-align:center;margin-bottom:14px}
  .rephead h2{font-size:18px}
  .rephead p{color:#444;font-size:12px}
}
</style>
</head>

let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s&&Array.isArray(s.members)){s.config=Object.assign({},DEF_CONFIG,s.config||{});return s;}
  }catch(e){}
  return {members:JSON.parse(JSON.stringify(SEED)),config:Object.assign({},DEF_CONFIG)};
}
/* save(t): t = member id ที่แก้ | 'cfg' เมื่อแก้การตั้งค่า | ไม่ใส่ = แค่ cache ในเครื่อง */
function save(t){
  localStorage.setItem(LS_KEY,JSON.stringify(state));
  if(t==='cfg')dirty.cfg=true;
  else if(t&&!dirty.m.includes(t))dirty.m.push(t);
  persistDirty();setSync('busy');clearTimeout(save._t);save._t=setTimeout(flush,600);
}
function saveDel(id){dirty.del.push(id);dirty.m=dirty.m.filter(x=>x!==id);save();}
function saveAll(){dirty.all=true;dirty.cfg=true;save();}

let dirty=loadDirty();
function loadDirty(){try{const d=JSON.parse(localStorage.getItem('tm_dirty'));if(d&&Array.isArray(d.m))return d;}catch(e){}return{m:[],del:[],cfg:false,all:false};}
function persistDirty(){localStorage.setItem('tm_dirty',JSON.stringify(dirty));}
function hasDirty(){return !!(dirty.all||dirty.cfg||dirty.m.length||dirty.del.length);}
async function sb(path,opts={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:opts.method||'GET',
    headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},opts.headers||{}),
    body:opts.body});
  if(!r.ok)throw new Error('sb '+r.status);
  return (r.headers.get('content-type')||'').includes('json')?r.json():null;
}
const UPSERT={Prefer:'resolution=merge-duplicates,return=minimal'};
function setSync(s){ /* true=ซิงก์แล้ว false=ออฟไลน์ 'busy'=กำลังบันทึก */
  const el=document.getElementById('saved');if(!el)return;el.style.opacity=1;
  if(s==='busy'){el.textContent='⏳ กำลังบันทึก...';el.style.color='#f0c04a';}
  else if(s){el.textContent='☁️ ซิงก์แล้ว';el.style.color='#9fdcb5';}
  else{el.textContent='📴 ออฟไลน์ — เก็บในเครื่อง รอซิงก์';el.style.color='#f3b3b3';}
}
let flushing=false;
async function flush(){
  if(flushing||!hasDirty())return;flushing=true;setSync('busy');
  try{
    if(dirty.all){
      await sb('tm_members?id=neq.__none__',{method:'DELETE'});
      dirty.all=false;dirty.del=[];dirty.m=state.members.map(m=>m.id);
    }
    if(dirty.del.length){await sb('tm_members?id=in.('+dirty.del.join(',')+')',{method:'DELETE'});dirty.del=[];}
    if(dirty.m.length){
      const rows=dirty.m.map(id=>findM(id)).filter(Boolean).map(m=>({id:m.id,data:m}));
      if(rows.length)await sb('tm_members',{method:'POST',headers:UPSERT,body:JSON.stringify(rows)});
      dirty.m=[];
    }
    if(dirty.cfg){await sb('tm_config',{method:'POST',headers:UPSERT,body:JSON.stringify([{key:'main',value:state.config}])});dirty.cfg=false;}
    setSync(true);
  }catch(e){setSync(false);}
  persistDirty();flushing=false;
}
async function pushAll(){
  await sb('tm_members',{method:'POST',headers:UPSERT,body:JSON.stringify(state.members.map(m=>({id:m.id,data:m})))});
  await sb('tm_config',{method:'POST',headers:UPSERT,body:JSON.stringify([{key:'main',value:state.config}])});
}

async function fetchAll(){
  const rows=await sb('tm_members?select=id,data&order=id');
  if(!rows.length){await pushAll();setSync(true);return;} /* คลาวด์ยังว่าง: ยกข้อมูลในเครื่องขึ้นไปตั้งต้น */
  if(hasDirty())return; /* มีของค้างส่ง — อย่าดึงมาทับ */
  const cfg=await sb('tm_config?key=eq.main&select=value');
  const incoming=rows.map(r=>Object.assign({},r.data,{id:r.id}));
  const changed=JSON.stringify(incoming)!==JSON.stringify(state.members);
  state.members=incoming;
  if(cfg.length)state.config=Object.assign({},DEF_CONFIG,cfg[0].value);
  localStorage.setItem(LS_KEY,JSON.stringify(state));
  if(changed&&!editing())render();
  setSync(true);
}

/* ---------- helpers ---------- */
const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pd(iso){if(!iso)return null;const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(d){if(!d)return '—';if(typeof d==='string')d=pd(d);return d?`${d.getDate()} ${THM[d.getMonth()]} ${d.getFullYear()}`:'—';}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function dayDiff(a,b){return Math.round((a-b)/864e5);}
const WEEKS=[
 ['Week 0','สัปดาห์แรกที่เข้ามาเป็นสมาชิก'],
 ['Week 1','Invite Visitor + Profile & GAINS sheet'],
 ['Week 2','Presentation, Top 10 Key Customer List'],
 ['Week 3','Good Referral, Contact Sphere List'],
 ['Week 4','1-2-1 Meeting'],
 ['Week 5','1-2-1 Meeting'],
 ['Week 6','5 นาที Presentation'],
 ['Week 7','Member Goal Setting'],
 ['Week 8','Substitute Policy'],
];
const SLIDES=[['onepage','ONEPAGE'],['s121','121'],['s5min','5 นาที']];
const HS=[
 {key:'m3', label:'Happiness Survey 3 เดือน', days:90, link:'link3'},
 {key:'m6', label:'Happiness Survey 6 เดือน', days:180, link:'link6'},
 {key:'m12',label:'Happiness Survey 12 เดือน (ก่อนต่ออายุ)', days:365, link:'link12'},
];
function findM(id){return state.members.find(m=>m.id===id);}
function wDone(m){return m.weeks.filter(w=>w===true).length;}
/* สัปดาห์ล่าสุดที่ทำแล้ว — รายงานแบบ สัปดาห์ที่ 0/8, 1/8, ... 8/8 (Week 0 คือสัปดาห์แรก) */
function wLast(m){let last=-1;m.weeks.forEach((w,i)=>{if(w===true)last=i;});return last;}
function wLabel(m){const l=wLast(m);return l<0?'ยังไม่เริ่ม':`สัปดาห์ที่ ${l}/8`;}
/* สไลด์ "มีแล้ว" ก็ต่อเมื่อ อัพโหลดไฟล์แล้ว หรือแอดมินกดยืนยันว่ามีแล้ว */
function hasSlide(m,k){return m.slides[k]===true||!!(m.slideFiles&&m.slideFiles[k]);}
function curWeek(m){const s=pd(m.start);if(!s)return null;const w=Math.floor(dayDiff(today(),s)/7);return w<0?0:(w>8?null:w);}
/* survey status: done | wait(ส่งแล้วรอตอบ) | due(ถึงกำหนด ยังไม่ส่ง) | notyet */
function hsInfo(m,h){
  const s=pd(m.start);const rec=m.hs[h.key];
  let due=s?addDays(s,h.days):null;
  let open=due; // วันที่เริ่มถึงกำหนดส่ง
  if(h.key==='m12'&&due){ // ส่งล่วงหน้า 6 เดือนก่อนวันต่ออายุ
    if(due<today()){const nx=new Date(due);while(nx<today())nx.setFullYear(nx.getFullYear()+1);due=nx;}
    open=addDays(due,-180);
  }
  let st='notyet';
  if(rec.done)st='done';
  else if(rec.sent)st='wait';
  else if(open&&today()>=open)st='due';
  return {due,open,st,rec};
}
const HS_BADGE={done:['b-done','✅ ทำแล้ว'],wait:['b-wait','📨 ส่งแล้ว รอคำตอบ'],due:['b-due','⏰ ถึงกำหนด ยังไม่ส่ง'],notyet:['b-notyet','⏳ ยังไม่ถึงกำหนด']};
function hsIcon(st){return {done:'✅',wait:'📨',due:'⏰',notyet:'▫️'}[st];}
function lineMsg(m,h){
  const link=state.config[h.link]||'(ยังไม่ได้ใส่ลิงก์แบบสอบถาม — ใส่ได้ที่หน้า ตั้งค่า)';
  return state.config.tpl.replace(/\{nick\}/g,m.nick||m.name).replace(/\{name\}/g,m.name)
    .replace(/\{survey\}/g,h.label).replace(/\{link\}/g,link);
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t);}
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  toast('คัดลอกข้อความแล้ว — นำไปวางในไลน์ได้เลย');
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e2a4a;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:.3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.opacity=0,2200);
}

/* ---------- nav ---------- */
const TABS=[['dash','🏠 แดชบอร์ด'],['members','👥 สมาชิก'],['survey','💛 Happiness Survey'],['report','📊 รายงานประธาน'],['settings','⚙️ ตั้งค่า']];
let tab='dash';
function go(t){tab=t;render();}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const v=document.getElementById('view');
  if(tab==='dash')v.innerHTML=vDash();
  else if(tab==='members')v.innerHTML=vMembers();
  else if(tab==='survey')v.innerHTML=vSurvey();
  else if(tab==='report')v.innerHTML=vReport();
  else v.innerHTML=vSettings();
}

/* ---------- dashboard ---------- */
let dueExpand=false,waitExpand=false,slideExpand=false;
function vDash(){
  const ms=state.members;
  const mentoring=ms.filter(m=>wDone(m)<9&&m.status==='ปีแรก');
  const finished=ms.filter(m=>wDone(m)===9);
  let due=[],wait=[];
  ms.forEach(m=>HS.forEach(h=>{const i=hsInfo(m,h);
    if(i.st==='due')due.push({m,h,i});
    if(i.st==='wait')wait.push({m,h,i});}));
  due.sort((a,b)=>a.i.open-b.i.open);
  mentoring.sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  const noSlide=ms.map(m=>({m,miss:SLIDES.filter(([k])=>!hasSlide(m,k))})).filter(x=>x.miss.length);
  noSlide.sort((a,b)=>((a.m.status==='ปีแรก'?0:1)-(b.m.status==='ปีแรก'?0:1))||(b.m.start||'').localeCompare(a.m.start||''));
  const ST=[['👥',ms.length,'สมาชิกทั้งหมด',''],['🎓',mentoring.length,'กำลัง Mentoring','gold'],['✅',finished.length,'จบครบ 8 สัปดาห์','green'],['⏰',due.length,'ถึงกำหนด ยังไม่ส่ง','red'],['📨',wait.length,'ส่งแล้ว รอคำตอบ','blue'],['🖼️',noSlide.length,'สไลด์ยังไม่ครบ','purple']];
  return `
  <div class="stats">${ST.map(([ic,n,l,c])=>`<div class="stat ${c}"><div class="ic">${ic}</div><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`).join('')}</div>

  <div class="card">
    <h2>🎓 Mentoring กำลังดำเนินการ <span class="cnt">${mentoring.length} คน</span></h2>
    ${mentoring.length?`<div class="mgrid">${mentoring.map(mcardHtml).join('')}</div>`
    :`<div class="empty">ไม่มีสมาชิกที่กำลัง Mentoring</div>`}
  </div>

  <div class="card">
    <h2>⏰ แบบสอบถามที่ถึงกำหนดส่ง <span class="cnt">${due.length} รายการ</span></h2>
    ${due.length?`<div class="tblwrap"><table><tr><th>สมาชิก</th><th>แบบสอบถาม</th><th>ถึงกำหนดตั้งแต่</th><th></th></tr>
    ${(dueExpand?due:due.slice(0,3)).map(({m,h,i})=>`<tr class="click" onclick="openMember('${m.id}')">
      <td class="mname">${esc(m.nick||'')} <small>${esc(m.name)}</small></td>
      <td>${h.label}</td>
      <td>${fmt(i.open)} <span style="color:var(--bad);font-size:11.5px">(${dayDiff(today(),i.open)} วันแล้ว)</span></td>
      <td style="white-space:nowrap;text-align:right">
        <button class="btn sm ghost" onclick="event.stopPropagation();copyText(lineMsg(findM('${m.id}'),HS.find(x=>x.key==='${h.key}')))">📋 คัดลอกข้อความ LINE</button>
        <button class="btn sm gold" onclick="event.stopPropagation();markSent('${m.id}','${h.key}')">✓ ส่งแล้ว</button>
      </td></tr>`).join('')}</table></div>
      ${due.length>3?`<button class="btn ghost sm expander" onclick="dueExpand=!dueExpand;render()">${dueExpand?'▲ ย่อกลับ':`▼ แสดงทั้งหมด ${due.length} รายการ`}</button>`:''}`
    :`<div class="empty">🎉 ไม่มีแบบสอบถามค้างส่ง</div>`}
  </div>

  <div class="card">
    <h2>📨 ส่งแล้ว รอคำตอบ <span class="cnt">${wait.length} รายการ</span></h2>
    ${wait.length?`<div class="tblwrap"><table><tr><th>สมาชิก</th><th>แบบสอบถาม</th><th></th></tr>
    ${(waitExpand?wait:wait.slice(0,3)).map(({m,h})=>`<tr class="click" onclick="openMember('${m.id}')">
      <td class="mname">${esc(m.nick||'')} <small>${esc(m.name)}</small></td>
      <td>${h.label}</td>
      <td style="text-align:right"><button class="btn sm" onclick="event.stopPropagation();markDone('${m.id}','${h.key}')">✅ ตอบแล้ว — บันทึกคำตอบ</button></td>
      </tr>`).join('')}</table></div>
      ${wait.length>3?`<button class="btn ghost sm expander" onclick="waitExpand=!waitExpand;render()">${waitExpand?'▲ ย่อกลับ':`▼ แสดงทั้งหมด ${wait.length} รายการ`}</button>`:''}`
    :`<div class="empty">ไม่มีรายการรอคำตอบ</div>`}

    <h2>🖼️ ยังไม่มีสไลด์ครบ 3 อย่าง <span class="cnt">${noSlide.length} คน</span></h2>

    ${(slideExpand?noSlide:noSlide.slice(0,3)).map(({m,miss})=>`<tr class="click" onclick="openMember('${m.id}')">
      <td class="mname">${esc(m.nick||'')} <small>${esc(m.name)}</small></td>
      <td><span class="badge ${m.status==='ปีแรก'?'b-first':'b-old'}">${esc(m.status||'—')}</span></td>
      <td>${miss.map(([k,l])=>`<span class="chip f">${l}</span>`).join(' ')}</td>
      <td style="font-size:12.5px">${esc(m.mentor||'—')}</td>
    </tr>`).join('')}</table></div>
      ${noSlide.length>3?`<button class="btn ghost sm expander" onclick="slideExpand=!slideExpand;render()">${slideExpand?'▲ ย่อกลับ':`▼ แสดงทั้งหมด ${noSlide.length} รายการ`}</button>`:''}`
    :`<div class="empty">🎉 ทุกคนมีสไลด์ครบแล้ว</div>`}
  </div>`;
}
const AV_COLORS=['#5b6cf0','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#22c55e'];
function avColor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length];}
function mcardHtml(m){
  const cw=curWeek(m),l=wLast(m),sd=SLIDES.filter(([k])=>hasSlide(m,k)).length;
  const behind=(cw!==null&&l<cw)?cw-l:0;
  const chip=cw===null?['#dcf7e9','#0a9152','ครบ 8 สัปดาห์แล้ว']
    :behind>=2?['#fee4e2','#d92d20',`สัปดาห์ที่ ${cw} · ช้า ${behind} สัปดาห์`]
    :behind===1?['#fdeed3','#b25e04',`สัปดาห์ที่ ${cw} · ช้า 1 สัปดาห์`]
    :['#e3ebfe','#2f5ce0',`สัปดาห์ที่ ${cw} · ตามแผน`];
  return `<div class="mcard" onclick="openMember('${m.id}')">
    <div class="mtop">
      <div class="avatar" style="background:${avColor(m.name)}">${esc((m.nick||m.name).trim().charAt(0))}</div>
      <div class="minfo"><b>${esc(m.nick||m.name)}</b><small>${esc(m.name)}</small></div>
      <span class="wchip" style="background:${chip[0]};color:${chip[1]}">${chip[2]}</span>
    </div>
    <div class="mmeta"><span>🎓 Mentor: ${esc(m.mentor||'ยังไม่ระบุ')}</span><span>📅 เริ่ม ${fmt(m.start)}</span></div>
    <div class="seg ${wDone(m)===9?'done':''}">${m.weeks.map(w=>`<i class="${w===true?'t':w===false?'f':''}"></i>`).join('')}</div>
    <div class="mprog"><b>${l<0?'ยังไม่เริ่ม':`ทำแล้วถึงสัปดาห์ที่ ${l}/8`}</b><span>สไลด์ ${sd}/3</span></div>
  </div>`;
}
function markSent(id,k){const m=findM(id);m.hs[k].sent=true;save(id);render();toast('บันทึก: ส่งแบบสอบถามแล้ว');}
function markDone(id,k){const m=findM(id);m.hs[k].done=true;save(id);openMember(id);toast('บันทึก: ตอบแล้ว — กรอกสรุปคำตอบด้านล่างได้เลย');}

/* ---------- members ---------- */
let q='',fil='all';
function vMembers(){
  let ms=[...state.members];
  if(q){const qq=q.toLowerCase();ms=ms.filter(m=>(m.name+' '+(m.nick||'')+' '+(m.prof||'')+' '+(m.mentor||'')).toLowerCase().includes(qq));}
  if(fil==='first')ms=ms.filter(m=>m.status==='ปีแรก');
  if(fil==='old')ms=ms.filter(m=>m.status!=='ปีแรก');
  if(fil==='mentoring')ms=ms.filter(m=>wDone(m)<9&&m.status==='ปีแรก');
  if(fil==='done')ms=ms.filter(m=>wDone(m)===9);
  ms.sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  return `
  <div class="card">
    <h2>👥 สมาชิก <span class="cnt">${ms.length}/${state.members.length} คน</span></h2>
    <div class="toolbar no-print">
      <input type="text" placeholder="🔍 ค้นหา ชื่อ / ชื่อเล่น / อาชีพ / Mentor" value="${esc(q)}" oninput="q=this.value;render()">
      <select onchange="fil=this.value;render()">

        <option value="old" ${fil==='old'?'selected':''}>เกิน 1 ปี</option>
        <option value="mentoring" ${fil==='mentoring'?'selected':''}>กำลัง Mentoring</option>
        <option value="done" ${fil==='done'?'selected':''}>จบ 8 สัปดาห์แล้ว</option>
      </select>
      <button class="btn gold" onclick="openAdd()">＋ เพิ่มสมาชิกใหม่</button>
    </div>
    <div class="tblwrap"><table>
      <tr><th>สมาชิก</th><th>อาชีพ</th><th>สถานะ</th><th>เริ่ม</th><th>Mentor</th><th>Week 0–8</th><th>สไลด์</th><th>Survey</th></tr>
      ${ms.map(m=>{
        const icons=HS.map(h=>hsIcon(hsInfo(m,h).st)).join(' ');
        return `<tr class="click" onclick="openMember('${m.id}')">
        <td class="mname">${esc(m.nick||'')} <small>${esc(m.name)}</small></td>

        <td style="white-space:nowrap">${fmt(m.start)}</td>
        <td style="font-size:12.5px">${esc(m.mentor||'—')}</td>
        <td><span class="wk">${m.weeks.map(w=>`<i class="${w===true?'t':w===false?'f':''}" title=""></i>`).join('')}</span> <span style="font-size:11px;color:var(--mut);white-space:nowrap">${wLast(m)<0?'ยังไม่เริ่ม':wLast(m)+'/8'}</span></td>
        <td>${SLIDES.map(([k,l])=>`<span class="chip ${hasSlide(m,k)?'t':m.slides[k]===false?'f':''}">${l}</span>`).join('')}</td>
        <td style="font-size:15px;letter-spacing:2px">${icons}</td>
        </tr>`;}).join('')}
    </table></div>
  </div>`;
}

async function uploadSlide(id,k,inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>10*1024*1024){toast('ไฟล์ใหญ่เกิน 10MB');return;}
  toast('⏳ กำลังอัพโหลด...');
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
  const path=id+'/'+k+'_'+Date.now()+'.'+ext;
  try{
    const r=await fetch(SB_URL+'/storage/v1/object/tm_slides/'+path,{method:'POST',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':f.type||'application/octet-stream','x-upsert':'true'},body:f});
    if(!r.ok)throw new Error(r.status);
  }catch(e){toast('❌ อัพโหลดไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต');return;}
  const m=findM(id);
  m.slideFiles=m.slideFiles||{};
  m.slideFiles[k]={url:SB_URL+'/storage/v1/object/public/tm_slides/'+path,name:f.name,path};
  m.slides[k]=true;
  save(id);openMember(id);toast('✅ อัพโหลดสไลด์แล้ว');
}
async function delSlideFile(id,k){
  const m=findM(id);const sf=m.slideFiles&&m.slideFiles[k];if(!sf)return;
  if(!confirm('ลบไฟล์สไลด์ "'+sf.name+'" ?'))return;
  try{await fetch(SB_URL+'/storage/v1/object/tm_slides/'+sf.path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});}catch(e){}
  delete m.slideFiles[k];
  save(id);openMember(id);toast('ลบไฟล์แล้ว');
}

/* CSV import — โครงเดียวกับไฟล์ The Top Mentor - Report.csv */
function parseCsv(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=ch;}
    else if(ch==='"')inQ=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(c=>c!==''))rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==''||row.length){row.push(cur);if(row.some(c=>c!==''))rows.push(row);}
  return rows;
}
function thDate(s){
  if(!s)return null;const p=s.trim().split(/\s+/);if(p.length!==3)return null;
  const mi=THM.indexOf(p[1]);if(mi<0)return null;
  return `${String(p[2]).padStart(4,'0')}-${String(mi+1).padStart(2,'0')}-${String(p[0]).padStart(2,'0')}`;
}
function tb(v){return v==='TRUE'?true:(v==='FALSE'?false:null);}
function impCsv(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const rows=parseCsv(r.result).slice(1);
    const ms=rows.filter(c=>c[1]&&c[1].trim()).map((c,i)=>({
      id:'m'+(i+1),name:c[1].trim(),nick:(c[3]||'').trim(),prof:(c[4]||'').trim(),status:(c[5]||'').trim(),
      start:thDate(c[6]),mentor:(c[7]||'').trim(),
      weeks:[tb(c[8]),tb(c[9]),tb(c[10]),tb(c[11]),tb(c[12]),tb(c[13]),tb(c[14]),tb(c[15]),tb(c[16])],
      slides:{onepage:tb(c[17]),s121:tb(c[18]),s5min:tb(c[19])},
      hs:{m3:{sent:!!tb(c[21]),done:!!tb(c[22]),note:''},m6:{sent:!!tb(c[24]),done:!!tb(c[25]),note:''},m12:{sent:!!tb(c[27]),done:!!tb(c[28]),note:''}},
      note:(c[29]||'').trim()}));
    if(!ms.length)throw 0;
    if(!confirm(`พบสมาชิก ${ms.length} คนในไฟล์ CSV — แทนที่ข้อมูลปัจจุบันทั้งหมด?`))return;
    state.members=ms;saveAll();render();toast('นำเข้า CSV แล้ว '+ms.length+' คน');
  }catch(e){toast('อ่านไฟล์ CSV ไม่สำเร็จ — ตรวจสอบว่าโครงคอลัมน์ตรงกับไฟล์รายงานเดิม');}};
  r.readAsText(f,'utf-8');
}

render();
/* boot: ส่งของค้าง (ถ้ามี) แล้วดึงข้อมูลล่าสุดจากคลาวด์ + ดึงซ้ำเมื่อกลับมาที่หน้าจอ/ทุก 90 วิ */
(hasDirty()?flush():Promise.resolve()).then(()=>fetchAll()).catch(()=>setSync(false));
setInterval(()=>{hasDirty()?flush():fetchAll().catch(()=>setSync(false));},90000);
window.addEventListener('focus',()=>{if(!hasDirty())fetchAll().catch(()=>setSync(false));});
window.addEventListener('online',()=>{if(hasDirty())flush();});
</script>
</body>
</html>
