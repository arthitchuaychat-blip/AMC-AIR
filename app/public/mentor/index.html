<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Top Mentoring — ระบบติดตาม Mentoring & Happiness Survey</title>
<meta name="theme-color" content="#e11d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Top Mentoring">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12203f; --ink2:#1c2a52; --gold:#e8a614; --gold2:#f6c64b;
  --navy:#1e2a4a; --navy2:#2b3b66;
  --brand:#e11d2a; --brand2:#b3121f; --brand-soft:#fdeaec;
  --bg:#f5f7fb; --card:#ffffff; --line:#e9edf5; --txt:#1b2440; --mut:#8a94ad;
  --ok:#12b76a; --bad:#ef4444; --warn:#f79009; --info:#3b6ef6;
  --sh:0 1px 2px rgba(28,42,82,.05),0 1px 3px rgba(28,42,82,.045);
  --sh2:0 10px 30px rgba(28,42,82,.09);
  --side-w:238px;
  --font:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--txt);font-size:14.5px;background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* ===== app shell (เมนูซ้าย) ===== */
#app{display:flex;min-height:100vh}
#side{width:var(--side-w);flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:15px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brandbox{display:flex;align-items:center;gap:10px;padding:5px 8px 13px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.brandbox .lg{width:38px;height:38px;flex:none}
.brandbox .bt{font-size:13.5px;font-weight:800;line-height:1.05;color:var(--brand);letter-spacing:.2px}
.brandbox .bt small{display:block;font-size:8.5px;font-weight:700;color:var(--mut);letter-spacing:.14em;margin-top:3px}
.navlbl{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:14px 12px 6px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:#44506d;font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 13px;border-radius:11px;cursor:pointer;transition:.14s}
#nav button:hover{background:#f4f6fb;color:var(--txt)}
#nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
#hdrUser{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.uchip{display:flex;align-items:center;gap:9px;min-width:0;font-size:12.5px;font-weight:700;color:var(--txt)}
.uchip .uav{width:33px;height:33px;border-radius:10px;flex:none;background:linear-gradient(135deg,#f26b73,var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.uchip .un{min-width:0;line-height:1.2}.uchip .un small{display:block;font-weight:400;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo{border:0;background:var(--brand-soft);color:var(--brand);font-family:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:11px;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:7px}
.lo:hover{background:var(--brand);color:#fff}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;min-height:56px}
#topbar .ptitle{font-size:16px;font-weight:800;line-height:1.15}
#topbar .ptitle small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.menobtn{display:none;border:0;background:#f4f6fb;width:38px;height:38px;border-radius:11px;font-size:17px;cursor:pointer;flex:none;color:var(--txt)}
#saved{font-size:11px;color:var(--mut);margin-left:auto;text-align:right;transition:.3s;white-space:nowrap}
#scrim{display:none}
main{max-width:1180px;width:100%;margin:0;padding:22px 24px 90px}
@media(max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 46px rgba(10,16,40,.28)}
  #app.navopen #side{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(10,16,40,.42);z-index:39}
  #app.navopen #scrim{display:block}
  .menobtn{display:inline-flex;align-items:center;justify-content:center}
  main{padding:18px 16px 90px}
}
#app.noauth #side,#app.noauth #topbar,#app.noauth #scrim{display:none}
#app.noauth main{max-width:none;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h2 .cnt{background:#f1f4fb;color:var(--mut);font-size:11.5px;padding:3px 11px;border-radius:99px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh);cursor:pointer;transition:.16s}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(28,42,82,.13);border-color:#d8dff0}
.card{scroll-margin-top:86px}
.stat .ic{width:46px;height:46px;border-radius:15px;font-size:21px;display:flex;align-items:center;justify-content:center;background:#f1f4fb;flex:none}
.stat .n{font-size:24px;font-weight:700;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.stat.gold .ic{background:#fdf1d2}.stat.green .ic{background:#dcf7e9}.stat.red .ic{background:#fee4e2}.stat.blue .ic{background:#e3ebfe}
.stat.gold .n{color:#b97e02} .stat.green .n{color:#0a9152} .stat.red .n{color:#d92d20} .stat.blue .n{color:#2f5ce0}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;color:#9aa3bd;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.7px}
td{padding:12px;border-bottom:1px solid #f2f4fa;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#f7f9ff}
.tblwrap{overflow-x:auto}
.mname{font-weight:600} .mname small{display:block;font-weight:300;font-size:11.5px;color:var(--mut)}
.wk{display:inline-flex;gap:3px}
.wk i{width:13px;height:13px;border-radius:4px;background:#e9edf6;display:inline-block;font-style:normal}
.wk i.t{background:var(--ok)} .wk i.f{background:var(--bad)}
.chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#f1f4fb;color:var(--mut);margin:1px;font-weight:500}
.chip.t{background:#dcf7e9;color:#0a9152} .chip.f{background:#fee4e2;color:#d92d20}
.badge{display:inline-block;font-size:11.5px;padding:4px 11px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-done{background:#dcf7e9;color:#0a9152} .b-wait{background:#e3ebfe;color:#2f5ce0}
.b-due{background:#fdeed3;color:#b25e04} .b-notyet{background:#f1f4fb;color:#8a94ad}
.b-first{background:#fdf1d2;color:#946b00} .b-old{background:#e9ebf7;color:#4a5480}
/* การ์ด Mentoring */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.mcard{border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;transition:.18s;background:linear-gradient(180deg,#fff,#fbfcff)}
.mcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,42,82,.12);border-color:#f0cf7e}
.mtop{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex:none;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14)}
.minfo{flex:1;min-width:0}
.minfo b{font-size:14.5px;display:block}
.minfo small{display:block;font-size:11px;color:var(--mut);font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip{font-size:10.5px;padding:4px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.mmeta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#5a6584;margin-bottom:11px}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg i{flex:1;height:9px;border-radius:6px;background:#e9edf6}
.seg i.t{background:linear-gradient(135deg,var(--gold2),var(--gold))}
.seg i.f{background:#f6b5b1}
.seg.done i.t{background:linear-gradient(135deg,#2fd58a,#0fa564)}
.mprog{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.mprog b{color:#3f4a6b;font-weight:600}
.slidechips{display:flex;gap:5px;margin-top:9px}
.slidechips .sc{flex:1;text-align:center;font-size:10.5px;font-weight:600;padding:4px 4px;border-radius:8px;background:#f1f4fb;color:#9aa3bd;white-space:nowrap}
.slidechips .sc.on{background:#dcf7e9;color:#0a9152}
/* ปุ่ม + ฟอร์ม */
button.btn{border:0;background:linear-gradient(135deg,#f0343f,var(--brand2));color:#fff;font-family:inherit;font-size:13px;padding:9px 17px;border-radius:12px;cursor:pointer;transition:.16s;box-shadow:0 3px 10px rgba(225,29,42,.22)}
button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(225,29,42,.3)}
button.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241c04;font-weight:600;box-shadow:0 3px 10px rgba(232,166,20,.35)}
button.btn.ghost{background:#eef1f9;color:var(--txt);box-shadow:none}
button.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
button.btn.red{background:#feecec;color:#d92d20;box-shadow:none}
input[type=text],input[type=date],input[type=url],select,textarea{font-family:inherit;font-size:13.5px;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);outline:none;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(225,29,42,.14)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filterbar{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;padding:12px 14px;background:#f5f7fc;border:1px solid var(--line);border-radius:14px}
.filterbar label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--mut);font-weight:600}
.filterbar select{padding:7px 10px;font-size:12.5px}
.filterbar .btn{margin-left:auto}
.todo{padding:9px 12px;margin-top:6px;background:#f7f9ff;border:1px solid var(--line);border-radius:11px;font-size:12.5px;cursor:pointer;transition:.12s}
.todo:hover{background:#eef2fc;border-color:#c9d5f0}
.todogrp{margin-bottom:12px}.todogrp:last-child{margin-bottom:0}
.todogrp>b{font-size:13px;display:block;margin-bottom:2px}
.toolbar input[type=text]{max-width:280px}
.toolbar select{width:auto}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
/* modal */
#ovl{position:fixed;inset:0;background:rgba(12,18,40,.5);backdrop-filter:blur(3px);display:none;z-index:100;overflow-y:auto;padding:26px 14px}
#ovl.show{display:block}
.modal{background:#fff;border-radius:22px;max-width:720px;margin:0 auto;padding:24px;position:relative;box-shadow:0 24px 60px rgba(10,16,40,.3)}
.modal .x{position:absolute;top:16px;right:18px;border:0;background:#eef1f9;width:34px;height:34px;border-radius:99px;cursor:pointer;font-size:15px;transition:.15s}
.modal .x:hover{background:#e2e7f3}
.modal h3{font-size:17px;margin-bottom:4px;padding-right:44px;font-weight:700}
.modal .sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.sect{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.sect h4{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.wkrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #f2f4fa}
.wkrow .t{flex:1}
.wkrow .t b{font-size:13px} .wkrow .t small{display:block;color:var(--mut);font-size:11.5px}
.tri{border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;padding:6px 13px;border-radius:99px;cursor:pointer;min-width:100px;transition:.15s}
.tri:hover{border-color:#c9d2e8}
.tri.t{background:#dcf7e9;border-color:#93e5bd;color:#0a9152;font-weight:600}
.tri.f{background:#fee4e2;border-color:#f6b5b1;color:#d92d20;font-weight:600}
.hsbox{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fcfdff}
.hsbox .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hsbox .top b{font-size:13px}
.cbl{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.cbl input{width:17px;height:17px;accent-color:var(--ok)}
.note-line{background:#fffaeb;border:1px solid #f7e6ad;border-radius:11px;padding:8px 12px;font-size:13px;margin-top:8px}
.help{background:#eef4ff;border:1px solid #d3e0fb;border-radius:16px;padding:15px;font-size:13px;line-height:1.7;color:#2b3f6b}
.empty{color:var(--mut);text-align:center;padding:26px;font-size:13px}
.expander{width:100%;margin-top:10px;text-align:center}
.stat.purple .ic{background:#efe7fe}.stat.purple .n{color:#7c3aed}
/* กล่องสไลด์ในหน้าสมาชิก */
.slbox{border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;background:#fcfdff}
.slbox.has{border-color:#93e5bd;background:#f6fdf9}
.slhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.slhead b{font-size:13px}
.slfile{display:flex;align-items:center;gap:6px;font-size:11.5px;background:#f1f4fb;border-radius:9px;padding:6px 9px}
.slfile a{color:#2f5ce0;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slfile a:hover{text-decoration:underline}
.slfile button{border:0;background:transparent;cursor:pointer;color:#98a1b8;font-size:13px}
.rephead{display:none}
.authwrap{max-width:392px;margin:9vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:0 18px 50px rgba(28,42,82,.14)}
.authwrap .lgo{text-align:center;margin-bottom:10px}
.authwrap .lgo svg{width:64px;height:64px}
.authwrap h2{text-align:center;font-size:19px;font-weight:700;margin-bottom:4px}
.authwrap p.sub{text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:20px}
.autherr{background:#fee4e2;color:#b32020;font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:12px;text-align:center}
@media print{
  body{background:#fff;font-size:12px}
  #side,#topbar,#scrim,.no-print{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:4px;page-break-inside:avoid}
  .rephead{display:block;text-align:center;margin-bottom:14px}
  .rephead h2{font-size:18px}
  .rephead p{color:#444;font-size:12px}
}
</style>
</head>

<div id="app" class="noauth">
  <aside id="side">
    <div class="brandbox">
      <span class="lg"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="The Top Mentoring"><defs><linearGradient id="tmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0343f"/><stop offset="1" stop-color="#b3121f"/></linearGradient></defs><polygon points="50,4 89,27 89,73 50,96 11,73 11,27" fill="url(#tmg)"/><g stroke="#fff" stroke-opacity=".16" stroke-width="1.4" fill="none"><path d="M50,4V50M89,27L50,50M89,73L50,50M50,96V50M11,73L50,50M11,27L50,50"/></g><path d="M50,17 L55.5,44.5 L83,50 L55.5,55.5 L50,83 L44.5,55.5 L17,50 L44.5,44.5 Z" fill="#fff"/><path d="M50,29 L53,47 L71,50 L53,53 L50,71 L47,53 L29,50 L47,47 Z" fill="#f0343f"/></svg></span>
      <div class="bt">THE TOP<br>MENTORING<small>PROFESSIONAL DEVELOPMENT</small></div>

</div>

/* ---------- state ---------- */
const LS_KEY='topmentor_v1';
const DEF_CONFIG={link3:'',link6:'',link12:'',font:'Prompt',tpl:'เรียนคุณ {nick} ({name})\nถึงกำหนดทำแบบสอบถาม {survey} ของ Chapter The Top แล้วครับ/ค่ะ\nรบกวนตอบแบบสอบถามได้ที่ลิงก์นี้\n{link}\nขอบคุณครับ/ค่ะ 🙏'};
/* ---------- ฟอนต์ (เลือกได้ในหน้าตั้งค่า) ---------- */
const FONTS=[
  ['Prompt','พรอมต์ — มนกลม อ่านสบาย (ค่าเริ่มต้น)'],
  ['Kanit','คณิต — เหลี่ยมเข้ม โมเดิร์น หนักแน่น'],
  ['Sarabun','สารบรรณ — ทางการ อ่านง่าย มาตรฐานราชการ'],
  ['IBM Plex Sans Thai','ไอบีเอ็ม เพล็กซ์ — โปรเฟสชันแนล สะอาด'],
  ['Anuphan','อนุพันธ์ — ร่วมสมัย เรียบ คมชัด'],
  ['Noto Sans Thai','โนโตะ — เป็นกลาง อ่านง่ายทุกขนาด']
];
function applyFont(name){
  const f=FONTS.find(x=>x[0]===name)?name:'Prompt';
  const link=document.getElementById('fontLink');
  if(link)link.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f)+':wght@300;400;500;600;700&display=swap';
  document.documentElement.style.setProperty('--font',`'${f}',system-ui,-apple-system,'Segoe UI',sans-serif`);
}
function setFont(name){state.config.font=name;save('cfg');applyFont(name);toast('เปลี่ยนฟอนต์เป็น '+name);}
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s&&Array.isArray(s.members)){s.config=Object.assign({},DEF_CONFIG,s.config||{});return s;}
  }catch(e){}
  return {members:JSON.parse(JSON.stringify(SEED)),config:Object.assign({},DEF_CONFIG)};
}
/* save(t): t = member id ที่แก้ | 'cfg' เมื่อแก้การตั้งค่า | ไม่ใส่ = แค่ cache ในเครื่อง */
function save(t){
  localStorage.setItem(LS_KEY,JSON.stringify(state));
  if(t==='cfg')dirty.cfg=true;
  else if(t&&!dirty.m.includes(t))dirty.m.push(t);

const THM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function pd(iso){if(!iso)return null;const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function fmt(d){if(!d)return '—';if(typeof d==='string')d=pd(d);return d?`${d.getDate()} ${THM[d.getMonth()]} ${d.getFullYear()}`:'—';}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function dayDiff(a,b){return Math.round((a-b)/864e5);}
const WEEKS=[
 ['Week 0','สัปดาห์แรกที่เข้ามาเป็นสมาชิก'],
 ['Week 1','Invite Visitor + Profile & GAINS sheet'],

 {key:'m3', label:'Happiness Survey 3 เดือน', days:90, link:'link3'},
 {key:'m6', label:'Happiness Survey 6 เดือน', days:180, link:'link6'},

/* วันครบกำหนดต่ออายุ = วันครบรอบปีถัดไปนับจากวันเริ่ม + นับถอยหลังเหลือกี่วัน */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function annivAfter(s,ref){let d=new Date(s);d.setFullYear(ref.getFullYear());while(d<ref)d.setFullYear(d.getFullYear()+1);return d;}
/* อายุสมาชิกนับจากวันเริ่ม */
function ageLabel(m){
  const s=pd(m.start);if(!s)return '—';const t=today();
  let mo=(t.getFullYear()-s.getFullYear())*12+(t.getMonth()-s.getMonth());
  if(t.getDate()<s.getDate())mo--;if(mo<0)mo=0;
  const y=Math.floor(mo/12),r=mo%12;
  return y?(r?`${y} ปี ${r} เดือน`:`${y} ปี`):(r?`${r} เดือน`:'ไม่ถึง 1 เดือน');
}
/* วันครบกำหนดต่ออายุ (ครบรอบปีถัดไป) + เหลือกี่วัน; ถ้าต่ออายุล่วงหน้าแล้ว (renewedUntil) จะเลื่อนไปรอบถัดไป */
function renewInfo(m){
  const s=pd(m.start);if(!s)return null;
  const t=today();
  let d=annivAfter(s,t);              // ครบรอบถัดไปนับจากวันนี้
  const ru=m.renewedUntil?pd(m.renewedUntil):null;
  let renewed=false;
  if(ru&&ru>=d){renewed=true;d=annivAfter(s,addDays(ru,1));} // ต่ออายุคลุมรอบนี้แล้ว → เลื่อนไปรอบหน้า
  return {date:d,days:dayDiff(d,t),renewed,until:ru};
}
function renewChip(m){
  const r=renewInfo(m);if(!r)return '';
  if(r.renewed)return `<span class="badge b-done">✅ ต่ออายุแล้ว (ถึง ${fmt(r.date)})</span>`;
  const soon=r.days<=30,warn=r.days<=90;
  const bg=soon?'#fee4e2':warn?'#fdeed3':'#e3ebfe',fg=soon?'#d92d20':warn?'#b25e04':'#2f5ce0';
  return `<span class="badge" style="background:${bg};color:${fg}">🔄 ต่ออายุ ${fmt(r.date)} · เหลือ ${r.days} วัน</span>`;
}

/* สัปดาห์ล่าสุดที่ทำแล้ว — รายงานแบบ สัปดาห์ที่ 0/8, 1/8, ... 8/8 (Week 0 คือสัปดาห์แรก) */
function wLast(m){let last=-1;m.weeks.forEach((w,i)=>{if(w===true)last=i;});return last;}
function wLabel(m){const l=wLast(m);return l<0?'ยังไม่เริ่ม':`สัปดาห์ที่ ${l}/8`;}
/* สไลด์ "มีแล้ว" ก็ต่อเมื่อ อัพโหลดไฟล์แล้ว หรือแอดมินกดยืนยันว่ามีแล้ว */
function hasSlide(m,k){return m.slides[k]===true||!!(m.slideFiles&&m.slideFiles[k]);}
function curWeek(m){const s=pd(m.start);if(!s)return null;const w=Math.floor(dayDiff(today(),s)/7);return w<0?0:(w>8?null:w);}
/* แบบสอบถามใช้ได้กับใคร: 3+6 เดือน = เฉพาะสมาชิกปีแรก · 12 เดือน = เฉพาะสมาชิกเกิน 1 ปี (ตามสถานะสมาชิก) */
function surveyApplies(m,h){const first=(m.status||'').trim()==='ปีแรก';return h.key==='m12'?!first:first;}
/* survey status: done | wait | due | notyet | na(ไม่เกี่ยวข้องกับสถานะสมาชิก — ซ่อน) */
function hsInfo(m,h){
  const s=pd(m.start);const rec=m.hs[h.key];
  let due=s?addDays(s,h.days):null;
  let open=due; // วันที่เริ่มถึงกำหนดส่ง
  if(h.key==='m12'){ // ส่ง 6 เดือนก่อน "วันครบกำหนดต่ออายุจริง" (ใช้ renewInfo ไม่ใช่ start+365)
    const r=renewInfo(m);
    if(r){due=r.date;open=addDays(r.date,-180);}else{due=null;open=null;}
  }
  let st='notyet';
  if(!surveyApplies(m,h))st='na';       // ไม่ตรงสถานะสมาชิก → ซ่อน
  else if(rec.done)st='done';
  else if(rec.sent)st='wait';
  else if(open&&today()>=open)st='due';
  return {due,open,st,rec};
}

let dueExpand=false,waitExpand=false,slideExpand=false,renewFil=180;
function vMentorTodo(ms){
  const due=[],slides=[],behind=[];
  ms.forEach(m=>{
    HS.forEach(h=>{const i=hsInfo(m,h);if(i.st==='due'||i.st==='wait')due.push({m,h});});
    if(m.status==='ปีแรก'){const miss=SLIDES.filter(([k])=>!hasSlide(m,k));if(miss.length)slides.push({m,miss});}
    const cw=curWeek(m),l=wLast(m);if(cw!==null&&l<cw)behind.push({m,gap:cw-l});
  });
  behind.sort((a,b)=>b.gap-a.gap);
  const none=!due.length&&!slides.length&&!behind.length;
  return `<div class="card" style="border:2px solid #f0cf7e">
    <h2>📋 งานที่ต้องดูแล — mentee ของฉัน <span class="cnt">${ms.length} คน</span></h2>
    ${none?`<div class="empty">🎉 เยี่ยม! mentee ทุกคนอัปเดตครบ ไม่มีงานค้าง</div>`:`
    ${behind.length?`<div class="todogrp"><b>🐢 Mentoring ช้ากว่าแผน (${behind.length})</b>${behind.map(({m,gap})=>`<div class="todo" onclick="openMember('${m.id}')">${esc(m.nick||m.name)} — ช้า ${gap} สัปดาห์ · ทำถึง ${wLast(m)<0?'ยังไม่เริ่ม':'สัปดาห์ที่ '+wLast(m)+'/8'}</div>`).join('')}</div>`:''}
    ${slides.length?`<div class="todogrp"><b>🖼️ สไลด์ยังไม่ครบ (${slides.length})</b>${slides.map(({m,miss})=>`<div class="todo" onclick="openMember('${m.id}')">${esc(m.nick||m.name)} — ขาด ${miss.map(([k,l])=>l).join(', ')}</div>`).join('')}</div>`:''}

/* คะแนนรายหมวดตามกฎ Traffic Light (ใช้แนะนำว่ายังเพิ่มได้ตรงไหน) */
function tlScores(t){const A=t.attend.A||0,L=t.attend.L||0,tr=t.training||0,bg=t.bizGiven||0,rw=t.refPerWk||0,vw=t.visitorPerWk||0,ow=t.oneToOnePerWk||0;
  return {pA:A===0?15:A===1?10:A===2?5:0,pL:L===0?10:L===1?5:0,
    pRef:rw>=1.5?20:rw>=1.2?15:rw>=1.0?10:rw>=0.75?5:0,pVis:vw>=0.75?20:vw>=0.5?15:vw>=0.25?10:vw>=0.01?5:0,
    p121:ow>=2?10:ow>=1?5:0,pTrain:tr>=4?20:tr>=3?15:tr>=2?10:tr>=1?5:0,pBiz:bg>=500000?15:bg>=200000?10:bg>=100000?5:0};
}
/* แนะนำว่าต้องทำอะไรอีกเพื่อขึ้นสีถัดไป (เหลือง→เขียว) */
function tlAdvice(t){
  if(!t||!Number.isFinite(t.score))return null;
  const cur=t.score,tier=cur>=70?'G':cur>=50?'Y':cur>=30?'R':'B';
  if(tier==='G')return {green:true};
  const target=tier==='Y'?70:50,targetName=target===70?'เขียว':'เหลือง',weeks=t.weeks||26,s=tlScores(t);
  const nx=(arr,v)=>arr.find(x=>v<x);const steps=[];
  if(s.pVis<20){const m=nx([0.01,0.25,0.5,0.75],t.visitorPerWk||0);if(m!=null)steps.push(`เชิญ Visitor เพิ่มอีก ${Math.max(1,Math.ceil(m*weeks)-(t.visitors||0))} คน (+5)`);}
  if(s.pRef<20){const m=nx([0.75,1.0,1.2,1.5],t.refPerWk||0);if(m!=null)steps.push(`ส่ง Referral ให้เพื่อนเพิ่มอีก ${Math.max(1,Math.ceil(m*weeks)-(t.refGiven||0))} ครั้ง (+5)`);}
  if(s.p121<10){const m=nx([1,2],t.oneToOnePerWk||0);if(m!=null)steps.push(`ทำ 1-2-1 เพิ่มอีก ${Math.max(1,Math.ceil(m*weeks)-(t.oneToOne||0))} ครั้ง (+5)`);}
  if(s.pTrain<20)steps.push('เข้าอบรม/พัฒนาทักษะเพิ่มอีก 1 ครั้ง (+5)');
  if(s.pBiz<15){const m=nx([100000,200000,500000],t.bizGiven||0);if(m!=null)steps.push(`ส่งมอบธุรกิจให้เพื่อน (TYFCB) เพิ่มอีก ${(m-(t.bizGiven||0)).toLocaleString('en-US')} บาท (+5)`);}
  const maintain=[];if((t.attend.A||0)>0)maintain.push(`ลดการขาดประชุม (ขาด ${t.attend.A} ครั้ง)`);if((t.attend.L||0)>0)maintain.push(`มาให้ตรงเวลา (สาย ${t.attend.L} ครั้ง)`);
  return {green:false,targetName,need:Math.max(5,target-cur),steps,maintain};
}
async function importTrafficXlsx(inp){
  const f=inp.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){toast('ไลบรารียังโหลดไม่เสร็จ ลองใหม่อีกครั้ง');return;}
  toast('⏳ กำลังอ่านไฟล์ Excel...');
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const title=String(rows[0][0]||'');const mm=title.match(/([A-Za-z]+)-(\d{2})/);
    const MTH={January:'ม.ค.',February:'ก.พ.',March:'มี.ค.',April:'เม.ย.',May:'พ.ค.',June:'มิ.ย.',July:'ก.ค.',August:'ส.ค.',September:'ก.ย.',October:'ต.ค.',November:'พ.ย.',December:'ธ.ค.'};
    const monthLabel=mm?`${MTH[mm[1]]||mm[1]} 20${mm[2]}`:'ล่าสุด';
    const num=v=>typeof v==='number'?v:(parseFloat(v)||0);
    const nrm=s=>String(s||'').toLowerCase().replace(/นาย|นาง|นางสาว|น\.ส\.|ดร\.?|mr\.?|ms\.?|mrs\.?/g,'').replace(/[^a-z0-9ก-๙]/g,'');
    const recs=rows.slice(2).filter(r=>typeof r[0]==='number'&&r[2]&&String(r[2]).trim()!=='Visitors').map(r=>{
      const refGiven=num(r[8])+num(r[9]),visitors=num(r[12]),oneToOne=num(r[13]);
      const refPerWk=num(r[18]),visitorPerWk=num(r[19]),oneToOnePerWk=num(r[20]),P=num(r[3]),A=num(r[4]),L=num(r[5]);
      const weeks=Math.round(oneToOnePerWk>0?oneToOne/oneToOnePerWk:refPerWk>0?refGiven/refPerWk:visitorPerWk>0?visitors/visitorPerWk:(P+A+L)||26)||26;
      return {name:String(r[2]).trim(),color:String(r[32]||'').trim().toUpperCase(),score:num(r[31]),attend:{P,A,L,M:num(r[6]),S:num(r[7])},refGiven,refReceived:num(r[10])+num(r[11]),visitors,oneToOne,training:num(r[15]),refPerWk,visitorPerWk,oneToOnePerWk,weeks,bizGiven:num(r[14]),bizReceived:num(r[33])};});
    if(!recs.length){toast('ไม่พบข้อมูลสมาชิกในไฟล์ — ตรวจสอบว่าเป็นไฟล์ Traffic Light');return;}
    const iso=new Date().toISOString().slice(0,10);let n=0,miss=[];
    recs.forEach(rec=>{const nn=nrm(rec.name);const m=state.members.find(x=>{const xn=nrm(x.name);return xn===nn||xn.includes(nn)||nn.includes(xn);});
      if(m){m.traffic=Object.assign({},rec,{month:monthLabel,updatedAt:iso});n++;}else miss.push(rec.name);});
    saveAll();render();
    toast(`✅ อัปเดต Traffic Light ${monthLabel} — ${n} คน${miss.length?` (ไม่พบ ${miss.length})`:''}`);
  }catch(e){toast('อ่านไฟล์ไม่สำเร็จ — ต้องเป็นไฟล์ .xlsx จากรายงาน Traffic Light');}
}

/* ---------- members ---------- */
let q='';
let mfil={status:'all',prog:'all',mentor:'all',slide:'all',survey:'all',traffic:'all'};
let msort='new';
function resetFilters(){mfil={status:'all',prog:'all',mentor:'all',slide:'all',survey:'all',traffic:'all'};msort='new';}
function membersList(){
  let ms=[...scopedMembers()];
  if(q){const qq=q.trim().toLowerCase();ms=ms.filter(m=>(m.name+' '+(m.nick||'')+' '+(m.prof||'')+' '+(m.mentor||'')).toLowerCase().includes(qq));}
  if(mfil.status==='first')ms=ms.filter(m=>m.status==='ปีแรก');
  else if(mfil.status==='old')ms=ms.filter(m=>m.status!=='ปีแรก');
  if(mfil.prog==='mentoring')ms=ms.filter(m=>wDone(m)<9&&m.status==='ปีแรก');
  else if(mfil.prog==='done')ms=ms.filter(m=>wDone(m)===9);
  if(mfil.mentor!=='all')ms=ms.filter(m=>(m.mentor||'').trim()===mfil.mentor);
  if(mfil.slide==='full')ms=ms.filter(m=>SLIDES.every(([k])=>hasSlide(m,k)));
  else if(mfil.slide==='incomplete')ms=ms.filter(m=>SLIDES.some(([k])=>!hasSlide(m,k)));
  if(mfil.survey==='pending')ms=ms.filter(m=>HS.some(h=>['due','wait'].includes(hsInfo(m,h).st)));
  else if(mfil.survey==='done')ms=ms.filter(m=>HS.some(h=>hsInfo(m,h).st==='done'));
  if(mfil.traffic!=='all')ms=ms.filter(m=>(m.traffic&&m.traffic.color)===mfil.traffic);
  if(msort==='old')ms.sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  else if(msort==='name')ms.sort((a,b)=>(a.nick||a.name||'').localeCompare(b.nick||b.name||'','th'));
  else if(msort==='progress')ms.sort((a,b)=>wLast(b)-wLast(a));
  else ms.sort((a,b)=>(b.start||'').localeCompare(a.start||'')); // ใหม่→เก่า (ค่าเริ่มต้น)
  return ms;
}

      const icons=HS.filter(h=>surveyApplies(m,h)).map(h=>hsIcon(hsInfo(m,h).st)).join(' ');

      <td class="mname"><div style="display:flex;align-items:center;gap:9px">${avatarHtml(m,34)}<div>${esc(m.nick||'')} <small>${esc(m.name)}</small></div></div></td>

async function uploadSlide(id,k,inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>10*1024*1024){toast('ไฟล์ใหญ่เกิน 10MB');return;}
  toast('⏳ กำลังอัพโหลด...');
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';
  const path=id+'/'+k+'_'+Date.now()+'.'+ext;
  try{
    const r=await fetch(SB_URL+'/storage/v1/object/tm_slides/'+path,{method:'POST',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':f.type||'application/octet-stream','x-upsert':'true'},body:f});
    if(!r.ok)throw new Error(r.status);
  }catch(e){toast('❌ อัพโหลดไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต');return;}
  const m=findM(id);
  m.slideFiles=m.slideFiles||{};
  m.slideFiles[k]={url:SB_URL+'/storage/v1/object/public/tm_slides/'+path,name:f.name,path};
  m.slides[k]=true;
  save(id);openMember(id);toast('✅ อัพโหลดสไลด์แล้ว');
}
async function delSlideFile(id,k){
  const m=findM(id);const sf=m.slideFiles&&m.slideFiles[k];if(!sf)return;
  if(!confirm('ลบไฟล์สไลด์ "'+sf.name+'" ?'))return;
  try{await fetch(SB_URL+'/storage/v1/object/tm_slides/'+sf.path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});}catch(e){}
  delete m.slideFiles[k];
  save(id);openMember(id);toast('ลบไฟล์แล้ว');
}

/* ประเมินความเสี่ยง/ความน่ากังวลจากคำตอบแบบสอบถาม */
function memberRisk(m){
  let score=null,renew='',reasons=[];
  for(const h of HS){if(!surveyApplies(m,h))continue;const rec=(m.hs&&m.hs[h.key])||{};if(!rec.done)continue;
    if(Number.isFinite(rec.happiness)&&(score===null||rec.happiness<score))score=rec.happiness;
    if(rec.renew)renew=rec.renew;}
  let level='ok';
  if(score!==null&&score<=5){level='high';reasons.push(`ความสุขต่ำ ${score}/10`);}
  else if(score!==null&&score<=6){level='watch';reasons.push(`ความสุขปานกลาง ${score}/10`);}
  if(renew==='ไม่ต่อ'){level='high';reasons.push('แจ้งว่าจะไม่ต่ออายุ');}
  else if(renew==='ยังไม่แน่ใจ'){if(level!=='high')level='watch';reasons.push('ยังไม่แน่ใจเรื่องต่ออายุ');}
  return {level,score,renew,reasons};
}
function memberComments(m){
  const out=[];
  for(const h of HS){if(!surveyApplies(m,h))continue;const rec=(m.hs&&m.hs[h.key])||{};if(!rec.done)continue;const a=rec.answers||{};
    if(a.feel)out.push(`ความรู้สึก: ${a.feel}`);
    if(a.improve&&a.improve!=='-'&&a.improve!=='ไม่มี')out.push(`ข้อเสนอ: ${a.improve}`);
    if(rec.note)out.push(`โน้ต: ${rec.note}`);}
  return out;
}
/* สถิติภาพรวม Chapter */
function chapterStats(ms){
  const scores=[];const renew={'ต่อ':0,'ยังไม่แน่ใจ':0,'ไม่ต่อ':0};
  ms.forEach(m=>{let r='';HS.forEach(h=>{if(!surveyApplies(m,h))return;const rec=(m.hs&&m.hs[h.key])||{};if(rec.done){if(Number.isFinite(rec.happiness))scores.push(rec.happiness);if(rec.renew)r=rec.renew;}});if(r&&renew[r]!==undefined)renew[r]++;});
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
  const dist={high:scores.filter(s=>s>=8).length,mid:scores.filter(s=>s>=6&&s<8).length,low:scores.filter(s=>s<=5).length};
  const age=m=>{const s=pd(m.start);return s?dayDiff(today(),s):-1;};
  const rnd=(k,fn)=>{const el=ms.filter(fn);return {done:el.filter(m=>m.hs&&m.hs[k]&&m.hs[k].done).length,total:el.length};};
  const first=m=>m.status==='ปีแรก';
  return {total:ms.length,nScore:scores.length,avg,dist,renew,
    first:ms.filter(first).length,over:ms.filter(m=>!first(m)).length,
    withMentor:ms.filter(m=>(m.mentor||'').trim()).length,
    comp:{m3:rnd('m3',first),m6:rnd('m6',first),m12:rnd('m12',m=>!first(m))}};
}

function authErr(msg){const e=document.getElementById('autherr');if(e)e.innerHTML=msg?`<div class="autherr">${esc(msg)}</div>`:'';}
async function doLogin(){
  const u=document.getElementById('lg_user').value.trim(),p=document.getElementById('lg_pass').value;
  if(!u||!p){authErr('กรอกชื่อผู้ใช้และรหัสผ่าน');return;}
  authErr('');const btn=event&&event.target;if(btn)btn.textContent='กำลังเข้าสู่ระบบ...';
  try{const j=await authApi('login',{username:u,password:p});
    if(!j.ok){authErr(j.error||'เข้าสู่ระบบไม่สำเร็จ');if(btn)btn.textContent='เข้าสู่ระบบ';return;}
    setAuth({username:j.user.username,role:j.user.role,name:j.user.name,mentorName:j.user.mentorName,token:j.token});
    tab='dash';render();toast('ยินดีต้อนรับ '+(j.user.name||j.user.username));
  }catch(e){authErr('ติดต่อเซิร์ฟเวอร์ไม่ได้');if(btn)btn.textContent='เข้าสู่ระบบ';}
}
async function doBootstrap(){
  const name=document.getElementById('bs_name').value.trim(),u=document.getElementById('bs_user').value.trim(),p=document.getElementById('bs_pass').value;
  if(!u||!p){authErr('กรอกชื่อผู้ใช้และรหัสผ่าน');return;}
  authErr('');
  try{const j=await authApi('bootstrapAdmin',{username:u,password:p,name});
    if(!j.ok){authErr(j.error||'สร้างบัญชีไม่สำเร็จ');return;}
    setAuth({username:j.user.username,role:'admin',name:j.user.name,mentorName:'',token:j.token});
    authMode='login';tab='dash';render();toast('สร้างบัญชีแอดมินแล้ว');
  }catch(e){authErr('ติดต่อเซิร์ฟเวอร์ไม่ได้');}
}
async function checkAuthMode(){
  try{const j=await authApi('status',{});if(j.ok&&!j.hasAdmin){authMode='bootstrap';if(!AUTH)render();}}catch(e){}
}

/* เลือก Mentor → เติม username เป็นชื่อจริงภาษาอังกฤษ + ชื่อ-สกุลอัตโนมัติ */
function onPickMentor(){
  const sel=document.getElementById('u_mn').value;
  const m=state.members.find(x=>mentorName(x)===sel);if(!m)return;
  const uu=document.getElementById('u_user');if(uu&&!uu.readOnly)uu.value=(m.name||'').trim();
  const nm=document.getElementById('u_name');if(nm&&!nm.value.trim())nm.value=(m.name||'').trim();
}
async function saveUser(edit){
  const g=i=>document.getElementById(i).value;
  const user={username:g('u_user').trim(),name:g('u_name').trim(),role:g('u_role'),mentorName:g('u_mn').trim(),password:g('u_pass')};
  const ue=document.getElementById('uerr');
  if(!user.username){ue.innerHTML='<div class="autherr">กรอกชื่อผู้ใช้</div>';return;}
  if(user.role==='mentor'&&!user.mentorName){ue.innerHTML='<div class="autherr">เลือกชื่อ Mentor ที่บัญชีนี้ดูแล</div>';return;}
  if(!edit&&!user.password){ue.innerHTML='<div class="autherr">ตั้งรหัสผ่านให้บัญชีใหม่</div>';return;}
  const j=await authApi('saveUser',{token:AUTH.token,user});
  if(!j.ok){ue.innerHTML=`<div class="autherr">${esc(j.error||'บันทึกไม่สำเร็จ')}</div>`;return;}
  closeModal();loadUsers();toast('บันทึกบัญชีแล้ว');
}
async function delUser(username){
  if(!confirm('ลบบัญชี "'+username+'" ?'))return;
  const j=await authApi('deleteUser',{token:AUTH.token,username});
  if(!j.ok){toast(j.error||'ลบไม่สำเร็จ');return;}
  loadUsers();toast('ลบบัญชีแล้ว');
}

/* CSV import — โครงเดียวกับไฟล์ The Top Mentor - Report.csv */
function parseCsv(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=ch;}
    else if(ch==='"')inQ=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(c=>c!==''))rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==''||row.length){row.push(cur);if(row.some(c=>c!==''))rows.push(row);}
  return rows;
}
function thDate(s){
  if(!s)return null;const p=s.trim().split(/\s+/);if(p.length!==3)return null;
  const mi=THM.indexOf(p[1]);if(mi<0)return null;
  return `${String(p[2]).padStart(4,'0')}-${String(mi+1).padStart(2,'0')}-${String(p[0]).padStart(2,'0')}`;
}
function tb(v){return v==='TRUE'?true:(v==='FALSE'?false:null);}
function impCsv(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const rows=parseCsv(r.result).slice(1);
    const ms=rows.filter(c=>c[1]&&c[1].trim()).map((c,i)=>({
      id:'m'+(i+1),name:c[1].trim(),nick:(c[3]||'').trim(),prof:(c[4]||'').trim(),status:(c[5]||'').trim(),
      start:thDate(c[6]),mentor:(c[7]||'').trim(),
      weeks:[tb(c[8]),tb(c[9]),tb(c[10]),tb(c[11]),tb(c[12]),tb(c[13]),tb(c[14]),tb(c[15]),tb(c[16])],
      slides:{onepage:tb(c[17]),s121:tb(c[18]),s5min:tb(c[19])},
      hs:{m3:{sent:!!tb(c[21]),done:!!tb(c[22]),note:''},m6:{sent:!!tb(c[24]),done:!!tb(c[25]),note:''},m12:{sent:!!tb(c[27]),done:!!tb(c[28]),note:''}},
      note:(c[29]||'').trim()}));
    if(!ms.length)throw 0;
    if(!confirm(`พบสมาชิก ${ms.length} คนในไฟล์ CSV — แทนที่ข้อมูลปัจจุบันทั้งหมด?`))return;
    state.members=ms;saveAll();render();toast('นำเข้า CSV แล้ว '+ms.length+' คน');
  }catch(e){toast('อ่านไฟล์ CSV ไม่สำเร็จ — ตรวจสอบว่าโครงคอลัมน์ตรงกับไฟล์รายงานเดิม');}};
  r.readAsText(f,'utf-8');
}
