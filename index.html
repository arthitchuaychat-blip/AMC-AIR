<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>วัสดุOS · ระบบจัดการสต๊อกวัสดุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#4f46e5; --radius:16px; --dunit:1; --appfont:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f7f8fb;
  --ink:#0f1729; --ink-2:#475569; --ink-3:#9aa3b2; --line:#e7e9f0; --line-2:#eef0f5;
  --up:#16a34a; --down:#dc2626; --warn:#f59e0b;
  --mono:'IBM Plex Mono',monospace;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --shadow-lg:0 12px 40px rgba(16,24,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--appfont);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd2dc;border-radius:9px;border:2px solid var(--bg)}
::selection{background:color-mix(in srgb,var(--primary) 22%,white)}

/* ---------- APP LAYOUT ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:266px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:14px}
.main{flex:1;overflow-y:auto;padding:calc(30px * var(--dunit)) calc(34px * var(--dunit))}

/* ---------- BRAND ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:6px 6px 2px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#000));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 30%,transparent)}
.brand-name{font-weight:700;font-size:18px;letter-spacing:-.2px}
.brand-name span{color:var(--primary);font-weight:600}
.brand-sub{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.3px}

/* ---------- ROLE SWITCH ---------- */
.role-switch{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);padding:5px;border-radius:13px;border:1px solid var(--line-2)}
.role-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s;white-space:nowrap}
.role-btn svg{flex:none}
.role-btn:hover{color:var(--ink);background:rgba(0,0,0,.025)}
.role-btn.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.role-btn.on svg{color:var(--primary)}

/* ---------- NAV ---------- */
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;margin-top:2px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 6px}
.nav-item{display:grid;grid-template-columns:18px 1fr;grid-template-rows:auto auto;column-gap:11px;align-items:center;text-align:left;padding:9px 12px;border-radius:10px;color:var(--ink-2);transition:.13s}
.nav-item svg{grid-row:span 2;color:var(--ink-3)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:color-mix(in srgb,var(--primary) 10%,white);color:var(--primary)}
.nav-item.on svg{color:var(--primary)}
.nav-th{font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-en{font-size:10.5px;color:var(--ink-3);font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.on .nav-en{color:color-mix(in srgb,var(--primary) 60%,var(--ink-3))}
.nav-item.team .nav-team-dot{width:12px;height:12px;border-radius:99px;grid-row:span 2;justify-self:center}
.nav-note{font-size:11.5px;color:var(--ink-3);line-height:1.6;padding:12px;background:var(--surface-2);border-radius:11px;margin-top:8px}

/* ---------- USER ---------- */
.side-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line-2)}
.user-chip{display:flex;align-items:center;gap:11px;padding:8px 6px}
.user-av{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.user-name{font-size:13.5px;font-weight:600;white-space:nowrap}
.user-role{font-size:11px;color:var(--ink-3)}

/* ---------- PAGE HEADERS ---------- */
.page-title{font-size:25px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.dash-head>div:first-child,.adm-head>div:first-child{min-width:0}
.page-title-en{font-size:14px;font-weight:500;color:var(--ink-3)}
.page-sub{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.dash-head,.adm-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px;flex-wrap:wrap}

/* ---------- CARDS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:calc(20px * var(--dunit));box-shadow:var(--shadow)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.sec-title{font-size:15.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.sec-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:500}
.big-total{font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.big-total small{font-size:11px;font-weight:500;color:var(--ink-3)}

/* ---------- SEGMENTED ---------- */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg-btn{padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);transition:.13s;white-space:nowrap}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:var(--primary);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 35%,transparent)}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stat-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.stat-trend{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.stat-val{font-size:27px;font-weight:700;letter-spacing:-.7px;line-height:1}
.stat-label{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:7px}
.stat-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* ---------- DASH GRID ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.span-2{grid-column:span 2}

/* ---------- TEAM BARS ---------- */
.tbars{display:flex;flex-direction:column;gap:13px}
.tbar-row{display:grid;grid-template-columns:96px 1fr 74px;align-items:center;gap:12px}
.tbar-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.tbar-track{height:11px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.tbar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.1,1)}
.tbar-val{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- RET STAT ---------- */
.ret-stat{display:flex;flex-direction:column;gap:7px}
.ret-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-weight:600}
.ret-row b{color:var(--ink);font-weight:700}
.ret-row.big{font-size:16px}.ret-row.big b{font-size:18px}
.ret-bar{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.ret-bar div{height:100%;border-radius:99px}
.ret-divider{height:1px;background:var(--line);margin:8px 0}
.ret-pct{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* ---------- LEGEND ---------- */
.legend{display:flex;gap:13px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);font-weight:600}

/* ---------- BAR CHART ---------- */
.barchart{display:flex;align-items:stretch;gap:6px;padding-top:18px}
.bar-col{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.bar-wrap{flex:1;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bar{width:64%;max-width:34px;border-radius:6px 6px 2px 2px;transition:height .5s cubic-bezier(.4,0,.1,1),background .15s}
.bar-stack{width:64%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;transition:height .5s cubic-bezier(.4,0,.1,1)}
.bar-x{font-size:9.5px;color:var(--ink-3);text-align:center;margin-top:7px;white-space:nowrap;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.bar-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:5}

/* ---------- TOP MAT / LOW STOCK ---------- */
.topmat{display:flex;flex-direction:column;gap:11px}
.topmat-row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px}
.topmat-name{font-size:13px;font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topmat-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.topmat-track div{height:100%;border-radius:99px;transition:width .5s}
.topmat-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.lowstock-card{display:flex;flex-direction:column}
.lowstock{display:flex;flex-direction:column;gap:9px;flex:1}
.lowstock-row{display:flex;align-items:center;gap:11px}
.lowstock-info{flex:1;min-width:0}
.lowstock-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lowstock-num{font-size:11px;color:var(--ink-3)}
.lowstock-order{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.lowstock-need{font-size:13px;font-weight:700;color:var(--down);background:color-mix(in srgb,var(--down) 11%,white);padding:3px 9px;border-radius:8px}
.lowstock-ordlabel{font-size:9px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.lowstock-more{font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:600;padding-top:4px}
.lowstock-cta{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700;padding:12px 10px;border-radius:11px;line-height:1.2;text-align:center;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 28%,transparent);transition:.15s}
.lowstock-cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
.lowstock-cta svg{flex:none}

/* ---------- BADGES / CHIPS ---------- */
.badge-warn{background:color-mix(in srgb,var(--down) 12%,white);color:var(--down);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.badge-warn.sm{font-size:10px;padding:2px 7px}
.code-chip{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
.team-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.team-chip-n{background:rgba(0,0,0,.08);border-radius:99px;padding:0 6px;font-size:11px}

/* ---------- STOCK BAR ---------- */
.stockbar-track{position:relative;height:8px;background:var(--surface-2);border-radius:99px;overflow:visible;margin:10px 0}
.stockbar-fill{height:100%;border-radius:99px;transition:width .4s}
.stockbar-min{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-3);border-radius:2px;z-index:2}

/* ---------- STEPPER ---------- */
.stepper{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--primary);transition:.12s}
.stepper button:hover:not(:disabled){background:color-mix(in srgb,var(--primary) 10%,white)}
.stepper button:disabled{color:var(--ink-3);opacity:.45;cursor:default}
.stepper-val{min-width:42px;text-align:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper-val small{font-weight:500;color:var(--ink-3);font-size:10px}

/* ---------- ADMIN HEAD ---------- */
.adm-head-stat{display:flex;gap:11px}
.mini-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 15px;text-align:right;box-shadow:var(--shadow)}
.mini-stat span{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.mini-stat b{font-size:17px;font-weight:700}

/* ---------- PURCHASE ---------- */
.po-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.po-rows{display:flex;flex-direction:column}
.po-row{display:grid;grid-template-columns:30px 1fr 78px 64px 116px 92px;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.po-row.po-row-h{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
.po-row.off{opacity:.45}
.po-row .c{text-align:center}.po-row .r{text-align:right}
.po-check input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.po-mat{display:flex;align-items:center;gap:10px;min-width:0}
.po-mat>div{min-width:0;flex:1}
.po-mat-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po-mat-code{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-3);font-size:13px;font-weight:600}
.stock-pill{display:inline-block;min-width:30px;padding:2px 8px;border-radius:7px;font-size:12.5px;font-weight:700}
.stock-pill.low{background:color-mix(in srgb,var(--warn) 16%,white);color:#b45309}
.stock-pill.crit{background:color-mix(in srgb,var(--down) 13%,white);color:var(--down)}
.po-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.po-summary{position:sticky;top:0}
.po-sum-list{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow-y:auto;margin-bottom:12px}
.po-sum-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:12.5px;align-items:center}
.po-sum-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po-sum-qty{color:var(--ink-3);font-size:11.5px}
.po-sum-val{font-weight:700;font-variant-numeric:tabular-nums}
.po-sum-total{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:2px solid var(--line);margin-top:4px;font-size:14px;font-weight:600}
.po-sum-total b{font-size:22px;font-weight:700;color:var(--primary)}
.po-note{font-size:11px;color:var(--ink-3);text-align:center;margin-top:10px}

/* ---------- BUTTONS ---------- */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:var(--primary);color:#fff;font-size:14px;font-weight:700;padding:11px 18px;border-radius:11px;transition:.15s;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 30%,transparent)}
.btn-primary svg{flex:none}
.btn-primary.big{width:100%;padding:14px;margin-top:6px}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-primary.ok{background:var(--up);box-shadow:0 4px 14px color-mix(in srgb,var(--up) 30%,transparent)}
.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--down);color:#fff;font-size:14px;font-weight:700;padding:13px;border-radius:11px;width:100%;transition:.15s}
.btn-danger:hover{filter:brightness(1.06)}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:40px 0}.empty.sm{padding:18px 0;font-size:12.5px}

/* ---------- APPROVE / RETURNS ---------- */
.approve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.approve-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-top:3px solid var(--team);transition:.2s}
.approve-card.issued{opacity:.6;background:var(--surface-2)}
.approve-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.approve-team{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.approve-job{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:7px}
.approve-items{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.approve-item{display:flex;align-items:center;gap:10px}
.approve-item-name{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approve-item-qty{font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.approve-item-qty.in{color:var(--up)}
.approve-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line-2)}
.approve-val{font-size:16px;font-weight:700}
.btn-issue{background:var(--primary);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-issue:hover{filter:brightness(1.07)}
.btn-issue.green{background:var(--up)}
.btn-issue.done{background:var(--up)}

/* ---------- DAMAGE ---------- */
.damage-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.fld{display:block;margin-bottom:15px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.fld-row{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--surface);color:var(--ink);transition:.15s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
select.inp{cursor:pointer}
.team-pick-row,.reason-row{display:flex;flex-wrap:wrap;gap:7px}
.team-pick{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.13s}
.reason-chip{padding:7px 13px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.13s}
.reason-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.photo-drop{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:18px;border:1.5px dashed var(--line);border-radius:11px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);transition:.15s}
.photo-drop:hover{border-color:var(--primary);color:var(--primary)}
.photo-drop.filled{border-style:solid;border-color:var(--up);color:var(--up);background:color-mix(in srgb,var(--up) 7%,white)}
.damage-cost{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:color-mix(in srgb,var(--down) 7%,white);border-radius:11px;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:13px}
.damage-cost b{font-size:19px;font-weight:700;color:var(--down)}
.damage-log{display:flex;flex-direction:column;gap:3px;max-height:460px;overflow-y:auto}
.damage-log-row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line-2)}
.damage-log-info{flex:1;min-width:0}
.damage-log-name{font-size:13px;font-weight:600}
.damage-log-name .qty{color:var(--ink-3);font-weight:600}

<script>

   app-data.js  —  Mock data + helpers for the Materials app
   Exposes window.APP = { categories, teams, materials, txns, fmt, helpers }
   ============================================================ */

  "use strict";

  /* ---------- seeded RNG (mulberry32) ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;

  const between = (a, b) => a + Math.floor(rnd() * (b - a + 1));

  /* ---------- categories ---------- */
  const categories = [
    { id: "pipe",   th: "ท่อทองแดง",      en: "Copper Pipe",  color: "#2563eb", icon: "pipe" },
    { id: "fit",    th: "ข้อต่อ/ฟิตติ้ง", en: "Fittings",     color: "#7c3aed", icon: "elbow" },
    { id: "ref",    th: "น้ำยาแอร์",       en: "Refrigerant",  color: "#0891b2", icon: "tank" },
    { id: "ins",    th: "ฉนวน",           en: "Insulation",   color: "#d97706", icon: "foam" },
    { id: "wire",   th: "สายไฟ",          en: "Wire / Cable", color: "#ea580c", icon: "wire" },
    { id: "elec",   th: "อุปกรณ์ไฟฟ้า",   color2: 1, en: "Electrical", color: "#16a34a", icon: "breaker" },
  ];
  const catById = Object.fromEntries(categories.map((c) => [c.id, c]));

  /* ---------- teams ---------- */
  const teams = [
    { id: "ARM",  name: "Team ARM",  color: "#2563eb", lead: "อาร์ม",  van: "1กข-1881" },
    { id: "KENG", name: "Team KENG", color: "#f97316", lead: "เก่ง",   van: "2คฆ-2042" },
    { id: "BOM",  name: "Team BOM",  color: "#16a34a", lead: "บอม",    van: "3งจ-3370" },
    { id: "PAT",  name: "Team PAT",  color: "#9333ea", lead: "แพท",    van: "4ฉช-4519" },
  ];
  const teamById = Object.fromEntries(teams.map((t) => [t.id, t]));

  /* ---------- materials catalog ---------- */
  // [code, th, en, cat, unit, cost, minStock, stock, icon?]
  const RAW = [
    ["COPP2", "ท่อทองแดงแบบม้วน 1/4\" (6.35mm)", "Copper Coil 1/4\"", "pipe", "เมตร", 62.0, 120, 86, "pipe"],
    ["COPP3", "ท่อทองแดงแบบม้วน 3/8\" (9.52mm)", "Copper Coil 3/8\"", "pipe", "เมตร", 95.33, 100, 142, "pipe"],
    ["COPP4", "ท่อทองแดงแบบม้วน 1/2\" (12.7mm)", "Copper Coil 1/2\"", "pipe", "เมตร", 126.0, 80, 41, "pipe"],
    ["COPM4", "ท่อทองแดง Type M 1/2\"", "Copper Pipe M 1/2\"", "pipe", "เมตร", 86.33, 60, 70, "pipe"],
    ["COPM6", "ท่อทองแดง Type M 3/4\"", "Copper Pipe M 3/4\"", "pipe", "เมตร", 164.5, 40, 18, "pipe"],
    ["COP14", "ข้อต่อตรงทองแดง 1/4\"", "Straight Coupling 1/4\"", "fit", "ชิ้น", 10.0, 80, 210, "couple"],
    ["COP12", "ข้อต่อตรงทองแดง 1/2\"", "Straight Coupling 1/2\"", "fit", "ชิ้น", 12.0, 60, 54, "couple"],
    ["C4514", "ข้องอ 45° 1/4\"", "Elbow 45° 1/4\"", "fit", "ชิ้น", 18.0, 60, 96, "elbow"],
    ["C9014", "ข้องอ 90° 1/4\"", "Elbow 90° 1/4\"", "fit", "ชิ้น", 15.0, 60, 33, "elbow"],
    ["C9012", "ข้องอ 90° 1/2\"", "Elbow 90° 1/2\"", "fit", "ชิ้น", 17.0, 50, 61, "elbow"],
    ["R32", "น้ำยาแอร์ R32 (10kg)", "Refrigerant R32", "ref", "ถัง", 3500.0, 5, 3, "tank"],
    ["R410", "น้ำยาแอร์ R410A (11.3kg)", "Refrigerant R410A", "ref", "ถัง", 4200.0, 4, 6, "tank"],
    ["INS14", "ฉนวนยาง 1/4\"", "Rubber Insulation 1/4\"", "ins", "เมตร", 22.0, 150, 88, "foam"],
    ["INS12", "ฉนวนยาง 1/2\"", "Rubber Insulation 1/2\"", "ins", "เมตร", 28.0, 120, 165, "foam"],
    ["THW25", "สายไฟ THW 2.5", "Wire THW 2.5", "wire", "เมตร", 18.0, 250, 130, "wire"],
    ["THW40", "สายไฟ THW 4.0", "Wire THW 4.0", "wire", "เมตร", 28.0, 200, 240, "wire"],
    ["VCT3", "สายไฟ VCT 3×2.5", "Cable VCT 3×2.5", "wire", "เมตร", 45.0, 120, 58, "wire"],
    ["BRK20", "เบรกเกอร์ 20A", "Breaker 20A", "elec", "ตัว", 185.0, 12, 9, "breaker"],
    ["CAP35", "คาปาซิเตอร์ 35µF", "Capacitor 35µF", "elec", "ตัว", 120.0, 15, 22, "cap"],
    ["BKT", "แท่นรองแอร์", "AC Bracket", "elec", "ชุด", 250.0, 20, 14, "bracket"],
    ["TAPE", "เทปพันท่อ PVC", "PVC Tape", "ins", "ม้วน", 15.0, 60, 47, "tape"],
    ["DRAIN", "ท่อน้ำทิ้ง PVC", "Drain Pipe PVC", "pipe", "เมตร", 12.0, 120, 95, "drain"],
    ["GAS", "แก๊สเชื่อม", "Brazing Gas", "elec", "กระป๋อง", 320.0, 8, 5, "gas"],
    ["SILVER", "ลวดเชื่อมเงิน 5%", "Silver Brazing Rod", "elec", "เส้น", 95.0, 30, 41, "rod"],
  ];
  const materials = RAW.map((r, i) => ({
    id: r[0], code: r[0], th: r[1], en: r[2], cat: r[3], catName: catById[r[3]].th,
    color: catById[r[3]].color, unit: r[4], cost: r[5], minStock: r[6], stock: r[7],
    icon: r[8] || catById[r[3]].icon, idx: i,
  }));
  const matById = Object.fromEntries(materials.map((m) => [m.id, m]));

  /* ---------- date helpers ---------- */
  const TODAY = new Date(2026, 5, 9); // 9 Jun 2026 (months 0-indexed)
  const dayMs = 86400000;
  function dstr(d) { return d.toISOString().slice(0, 10); }
  const TODAY_STR = dstr(TODAY);

  /* ---------- generate transactions ----------
     types: withdraw | return | damage | purchase
     record: { date, ts, team, jobNo, mat, qty, value, type, reason? }            */
  const txns = [];
  const DAMAGE_REASONS = ["ชำรุด", "หาย", "หมดอายุ", "ใช้ผิดงาน"];
  const damageCounter = {};
  let jobSeq = {};

  const DAYS = 545; // ~18 months of history
  for (let d = DAYS - 1; d >= 0; d--) {
    const date = new Date(TODAY.getTime() - d * dayMs);
    const dow = date.getDay();
    if (dow === 0) continue; // closed Sundays
    const ds = dstr(date);
    const ymd = ds.replace(/-/g, "").slice(2); // yymmdd

    // each team runs 1–3 jobs/day
    teams.forEach((team) => {
      const jobs = between(1, 3);
      for (let j = 0; j < jobs; j++) {
        jobSeq[ds] = (jobSeq[ds] || 0) + 1;
        const jobNo = "JB-" + ymd + "-" + String(jobSeq[ds]).padStart(2, "0");
        const nItems = between(2, 5);
        const used = new Set();
        for (let k = 0; k < nItems; k++) {
          const m = pick(materials);
          if (used.has(m.id)) continue;
          used.add(m.id);
          const qty = m.cost > 1000 ? between(1, 2) : (m.unit === "เมตร" ? between(4, 40) : between(2, 24));
          txns.push({ date: ds, team: team.id, jobNo, mat: m.id, qty, value: +(qty * m.cost).toFixed(2), type: "withdraw" });
          // return a portion (left over)
          if (rnd() < 0.6) {
            const ret = Math.floor(qty * (rnd() * 0.35));
            if (ret > 0) txns.push({ date: ds, team: team.id, jobNo, mat: m.id, qty: ret, value: +(ret * m.cost).toFixed(2), type: "return" });
          }
          // occasional damage
          if (rnd() < 0.08) {
            const dq = between(1, Math.max(1, Math.floor(qty * 0.2)));
            txns.push({ date: ds, team: team.id, jobNo, mat: m.id, qty: dq, value: +(dq * m.cost).toFixed(2), type: "damage", reason: pick(DAMAGE_REASONS) });
          }
        }
      }
    });

    // morning purchasing (restock) — a few SKUs per day
    const nBuy = between(2, 6);
    const bought = new Set();
    for (let b = 0; b < nBuy; b++) {
      const m = pick(materials);
      if (bought.has(m.id)) continue;
      bought.add(m.id);
      const qty = m.unit === "เมตร" ? between(50, 300) : (m.cost > 1000 ? between(2, 6) : between(20, 120));
      txns.push({ date: ds, team: null, jobNo: "PO-" + ymd + "-" + String(b + 1).padStart(2, "0"), mat: m.id, qty, value: +(qty * m.cost).toFixed(2), type: "purchase" });
    }
  }

  /* ---------- aggregation helpers ---------- */
  function startOf(period, ref) {
    const r = ref || TODAY;
    if (period === "day") return new Date(r.getFullYear(), r.getMonth(), r.getDate());
    if (period === "month") return new Date(r.getFullYear(), r.getMonth(), 1);
    if (period === "year") return new Date(r.getFullYear(), 0, 1);
    return new Date(2000, 0, 1); // all
  }
  function inPeriod(rec, period, ref) {
    if (period === "all") return true;
    const s = startOf(period, ref);
    const t = new Date(rec.date + "T00:00:00");
    if (period === "day") return rec.date === dstr(ref || TODAY);
    return t >= s;
  }
  function filter(opts) {
    const { period = "all", ref = TODAY, type, team } = opts || {};
    return txns.filter((r) =>
      (!type || r.type === type) &&
      (team === undefined || r.team === team) &&
      inPeriod(r, period, ref)
    );
  }
  function sum(recs, key) { return recs.reduce((a, r) => a + (r[key] || 0), 0); }

  // totals by team for a given type+period -> { ARM:{value,qty}, ... , _total:{} }
  function byTeam(type, period, ref) {
    const out = { _total: { value: 0, qty: 0, count: 0 } };
    teams.forEach((t) => (out[t.id] = { value: 0, qty: 0, count: 0 }));
    filter({ type, period, ref }).forEach((r) => {
      if (!r.team) return;
      out[r.team].value += r.value; out[r.team].qty += r.qty; out[r.team].count++;
      out._total.value += r.value; out._total.qty += r.qty; out._total.count++;
    });
    return out;
  }

  // time series for a type over last N buckets of a granularity
  function series(type, gran, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      let label, from, to;
      const r = new Date(TODAY);
      if (gran === "day") {
        const d = new Date(TODAY.getTime() - i * dayMs);
        from = dstr(d); to = from;
        label = d.toLocaleDateString("th-TH", { day: "numeric", month: "short" });
      } else if (gran === "month") {
        const d = new Date(r.getFullYear(), r.getMonth() - i, 1);
        const e = new Date(r.getFullYear(), r.getMonth() - i + 1, 0);
        from = dstr(d); to = dstr(e);
        label = d.toLocaleDateString("th-TH", { month: "short", year: "2-digit" });
      } else {
        const y = r.getFullYear() - i;
        from = y + "-01-01"; to = y + "-12-31";
        label = String(y + 543).slice(2); // พ.ศ. 2 digit
      }
      const v = txns.filter((x) => x.type === type && x.date >= from && x.date <= to);
      out.push({ label, value: sum(v, "value"), qty: sum(v, "qty") });
    }
    return out;
  }

  // purchase suggestion: stock below min
  function purchaseSuggestions() {
    return materials
      .filter((m) => m.stock < m.minStock)
      .map((m) => ({ ...m, need: m.minStock - m.stock, orderValue: +((m.minStock - m.stock) * m.cost).toFixed(2) }))
      .sort((a, b) => (a.stock / a.minStock) - (b.stock / b.minStock));
  }

  /* ---------- today's live queues (for admin/technician) ---------- */
  function todays(type) {
    return txns.filter((r) => r.date === TODAY_STR && r.type === type);
  }

  /* ---------- formatting ---------- */
  const fmtBaht = (n) => "฿" + Math.round(n).toLocaleString("en-US");
  const fmtBaht2 = (n) => "฿" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtNum = (n) => Math.round(n).toLocaleString("en-US");
  const fmtCompact = (n) => {
    if (n >= 1e6) return "฿" + (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return "฿" + (n / 1e3).toFixed(1) + "K";
    return "฿" + Math.round(n);
  };
  function thDate(d) {
    return (d || TODAY).toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  window.APP = {
    categories, catById, teams, teamById, materials, matById, txns,
    TODAY, TODAY_STR,
    helpers: { filter, sum, byTeam, series, purchaseSuggestions, todays, startOf, dstr },
    fmt: { fmtBaht, fmtBaht2, fmtNum, fmtCompact, thDate },
  };
})();
